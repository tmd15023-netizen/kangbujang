<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의뢰 내역 확인 | 강부장부동산</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #d9534f;
    }

    .admin-header h1 {
      font-size: 20px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .admin-btn {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .admin-btn--danger {
      background: #d9534f;
      color: #fff;
      border-color: #d9534f;
    }

    .admin-note {
      font-size: 12px;
      color: #777;
      line-height: 1.7;
      margin-bottom: 16px;
      padding: 12px;
      background: #fafafa;
      border: 1px dashed #ddd;
    }

    .admin-empty {
      text-align: center;
      padding: 48px 16px;
      color: #777;
      border: 1px dashed #ddd;
      background: #fff;
    }

    .admin-table-wrap {
      overflow-x: auto;
      border: 1px solid #ddd;
      background: #fff;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .admin-table th,
    .admin-table td {
      border-bottom: 1px solid #eee;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    .admin-table th {
      background: #f5f5f5;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="admin-page">
    <div class="admin-header">
      <h1>매도/매수 의뢰 내역</h1>
      <div class="admin-actions">
        <a href="index.html" class="admin-btn">← 메인으로</a>
        <button type="button" class="admin-btn" id="refreshBtn">새로고침</button>
        <button type="button" class="admin-btn admin-btn--danger" id="clearBtn">전체 삭제</button>
      </div>
    </div>

    <p class="admin-note">
      이 페이지는 <strong>같은 브라우저에 임시 저장된 의뢰</strong>를 보여줍니다.
      고객 의뢰를 안정적으로 받으려면 <code>google-apps-script.gs</code> 설정 후
      <code>script.js</code>의 <code>INQUIRY_SHEET_URL</code>을 연결하세요.
      연결 후에는 Google 스프레드시트와 이메일로 의뢰가 저장됩니다.
    </p>

    <div id="adminContent"></div>
  </div>

  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'kangboss_inquiries';

      function loadInquiries() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (err) {
          return [];
        }
      }

      function render() {
        var list = loadInquiries();
        var container = document.getElementById('adminContent');

        if (list.length === 0) {
          container.innerHTML = '<p class="admin-empty">저장된 의뢰가 없습니다.</p>';
          return;
        }

        container.innerHTML =
          '<div class="admin-table-wrap"><table class="admin-table">' +
            '<thead><tr>' +
              '<th>접수시간</th><th>이름</th><th>연락처</th><th>의뢰유형</th><th>문의 내용</th>' +
            '</tr></thead>' +
            '<tbody>' +
              list.map(function (item) {
                return '<tr>' +
                  '<td>' + (item.submitted_at || '-') + '</td>' +
                  '<td>' + (item.name || '-') + '</td>' +
                  '<td>' + (item.phone || '-') + '</td>' +
                  '<td>' + (item.type || '-') + '</td>' +
                  '<td>' + (item.message || '-') + '</td>' +
                '</tr>';
              }).join('') +
            '</tbody>' +
          '</table></div>';
      }

      document.getElementById('refreshBtn').addEventListener('click', render);

      document.getElementById('clearBtn').addEventListener('click', function () {
        if (!confirm('저장된 의뢰 내역을 모두 삭제할까요?')) return;
        localStorage.removeItem(STORAGE_KEY);
        render();
      });

      render();
    })();
  </script>
</body>
</html>
